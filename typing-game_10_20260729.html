<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScriptで簡単なタイピングゲームを作ってみよう</title>
    <style>
    /*
    html5doctor.com Reset Stylesheet
    v1.6.1
    Last Updated: 2010-09-17
    Author: Richard Clark - http://richclarkdesign.com
    Twitter: @rich_clark
    */
    html {
        touch-action: manipulation;
    }
    html, body, div, span, object, iframe,
    h1, h2, h3, h4, h5, h6, p, blockquote, pre,
    abbr, address, cite, code,
    del, dfn, em, img, ins, kbd, q, samp,
    small, strong, sub, sup, var,
    b, i,
    dl, dt, dd, ol, ul, li,
    fieldset, form, label, legend,
    table, caption, tbody, tfoot, thead, tr, th, td,
    article, aside, canvas, details, figcaption, figure,
    footer, header, hgroup, menu, nav, section, summary,
    time, mark, audio, video {
        margin:0;
        padding:0;
        border:0;
        outline:0;
        font-size:100%;
        vertical-align:baseline;
        background:transparent;
    }
    body {
        line-height:1;
    }
    article,aside,details,figcaption,figure,
    footer,header,hgroup,menu,nav,section {
        display:block;
    }
    ul {
        list-style:none;
    }
    blockquote, q {
        quotes:none;
    }
    blockquote:before, blockquote:after,
    q:before, q:after {
        content:'';
        content:none;
    }
    a {
        margin:0;
        padding:0;
        font-size:100%;
        vertical-align:baseline;
        background:transparent;
    }
    /* change colours to suit your needs */
    ins {
        background-color:#ff9;
        color:#000;
        text-decoration:none;
    }
    /* change colours to suit your needs */
    mark {
        background-color:#ff9;
        color:#000;
        font-style:italic;
        font-weight:bold;
    }
    del {
        text-decoration: line-through;
    }
    abbr[title], dfn[title] {
        border-bottom:1px dotted;
        cursor:help;
    }
    table {
        border-collapse:collapse;
        border-spacing:0;
    }
    /* change border colour to suit your needs */
    hr {
        display:block;
        height:1px;
        border:0;  
        border-top:1px solid #cccccc;
        margin:1em 0;
        padding:0;
    }
    input, select {
        vertical-align:middle;
    }
    /* Reset CSS ここまで */

    body {
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Arial", "Yu Gothic", "Meiryo", sans-serif;
        background: #fff7e8;
        color:#4A3B2A
    }
    .text-container {
        width: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position:relative;
    }
    .text-container label {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .question {
        display: flex;
        font-size: 4vw;
        font-weight: bold;
        letter-spacing: 0.25em;
        text-align: center;
    }
    .marker {
        background: #91dbf1;
    }
    .text {
        width: 100%;
        border: none;
        margin-top: 2rem;
        font-size: 2vw;
        letter-spacing: 0.1em;
        text-align: center;
    }
    .text:focus, .text:focus-visible {
        border: none;
        outline: none;
    }
    .gameClear {
        display: block;
        margin-top: 2rem;
        font-size: 1.5rem;
        text-align: center;
    }
    .titleScreen {
        display: block;
        margin-top: 2rem;
        font-size: 1.5rem;
        text-align: center;
    }
    .button {
        margin-top: 1.5px;
        width:220px;
        height:55px;
        border-radius:40px;
        background:#FFB347;
        color:white;
        font-size:20px;
        font-weight:bold;
        cursor: pointer;
        transition:.2s;
    }
    .button:hover{
        background:#FF8C42;
        transform:scale(1.05);
    }
    .hidden {
        display: none;
    }
    .answerBtn{
        width:180px;
        height:60px;
        border:none;
        border-radius:35px;
        background:#E85D5D;
        color:white;
        font-weight:bold;
        margin:10px;
        font-size:20px;
        cursor:pointer;
        transition:.2s;
    }
    .answerBtn:hover{
        background:#FFB347;
        transform:scale(1.05);
    }
    .imageArea{
        background:#FFFDF8;
        box-sizing:border-box;
        transition: 0.2s;
        border:6px solid #E85D5D;
        border-radius:20px;
        padding:20px;
        box-shadow:0 10px 20px rgba(0,0,0,.15);
        position:relative;
        width:300px;
        height:400px;
        display:flex;
        justify-content:center;
        align-items:center;
    }
    #questionImage{
        max-width:100%;
        max-height:100%;
    }
    #judgeImage{
        position:absolute;
        width:180px;
        top:50%;
        left: 50%;
        transform:translate(-50%,-50%);
        display:none;
    }
    .buttonArea{
        margin-top:20px;
        width:400px;
        display:flex;
        justify-content:center;
    }
    .statusArea{
        position:absolute;
        top:20px;
        left:20px;
        display:flex;
        flex-direction:column;
        gap:20px;
    }
    #questionNumber{
        font-size:34px;
        background:white;
        padding:8px 20px;
        border-radius:30px;
        box-shadow:0 3px 10px rgba(0,0,0,.15);
        font-weight:bold;
    }
    #timeNumber{
        width:70px;
        filter:drop-shadow(0 3px 5px rgba(0,0,0,.25));
    }
    .message{
        font-size: 42px;
        font-weight: bold;
        color: #E67E22;
        text-align:center;
        text-shadow:2px 2px white,0 0 10px #FFD966;
    }
    #resultMessage{
        font-size:32px;
        line-height:1.8;
        text-align:center;
    }
    .startButton{
        margin-top:40px;
    }
    .description{
        width:600px;
        max-width:90%;
        margin:25px auto;
        padding:20px;
        background:#FFF8E8;
        border:4px solid #E85D5D;
        border-radius:18px;
        color:#5A4030;
        line-height:1.8;
        font-size:18px;
        text-align:center;
    }
    .linkArea{
        margin-top:30px;
        display:flex;
        gap:12px;
        justify-content:center;
        flex-wrap:wrap;
    }
    .subButton{
        display:inline-block;
        padding:10px 18px;
        background:#FFFDF8;
        border:2px solid #E85D5D;
        border-radius:999px;
        color:#E85D5D;
        text-decoration:none;
        font-size:15px;
        font-weight:bold;
        transition:.2s;
    }
    .subButton:hover{
        background:#E85D5D;
        color:white;
        transform:translateY(-2px);
    }
    #shareBtn{
        background:#000;
    }
    #shareBtn:hover{
        background:#333;
    }
    .note{
        margin-top:15px;
        font-size:15px;
        color:#777;
    }
    .buttonColumn{
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:15px;
        margin:25px 0;
    }

    /* ==========================
    スマホ対応
    ========================== */
    @media screen and (max-width: 768px){
        .message{
            font-size:30px;
            line-height:1.4;
        }
        .description{
            width:90%;
            font-size:16px;
            padding:16px;
            margin:18px auto;
        }
        .imageArea{
            width:85vw;
            max-width:320px;
            height:60vh;
            max-height:420px;
            padding:12px;
        }
        #judgeImage{
            width:45vw;
            max-width:170px;
        }
        .buttonArea{
            width:100%;
            flex-direction:column;
            align-items:center;
        }
        .answerBtn{
            width:80%;
            max-width:280px;
            height:58px;
            font-size:20px;
            margin:8px 0;
        }
        .button{
            width:80%;
            max-width:280px;
            height:55px;
            font-size:18px;
            margin:8px auto;
            display:block;
        }
        .linkArea{
            flex-direction:column;
            align-items:center;
        }
        .subButton{
            width:80%;
            max-width:300px;
            text-align:center;
        }
        .statusArea{
            top:10px;
            left:10px;
            gap:10px;
        }
        #questionNumber{
            font-size:22px;
            padding:6px 14px;
        }
        #timeNumber{
            width:55px;
        }
        #resultMessage{
            font-size:24px;
            padding:0 10px;
        }
        #questionImage{
            max-width:100%;
            max-height:100%;
            object-fit:contain;
        }
    }

    </style>
</head>
<body>
    <div id="titleScreen" class="text-container">  
        <div class="message">
            しぐれうい  判別試験<br>
            <div class="description">
                <p>全問10問・制限時間3秒</p>
                <p>表示された画像が『しぐれうい』それとも<br>『ういだがー』かを判定してください。</p>
                <p>時間切れは不正解です。</p>
            </div>
            <button id="startBtn" class="button startButton">試験スタート</button>
            <div class="linkArea">
                <a href="disclaimer.html" class="subButton">📖免責事項・素材一覧</a>
                <a href="https://muato1.github.io/UIdaga_fancite1/" target="_blank" class="subButton">🗡非公式ファンサイト</a>
            </div>
            <p class="note">※ファンメイド作品です。🖋</p>
        </div>
    </div>

    <div id="countdown" class="text-container hidden">
        <h1>試験開始まで</h1>
        <div class="message"></div>
    </div>

    <div id="game" class="text-container hidden">
        <!--左上情報-->
        <div class="statusArea">
            <div id="questionNumber"></div>
            <img id="timeNumber" src="" alt="">
        </div>
        <!--画像エリア-->
        <div class="imageArea">
            <img id="questionImage" src="" alt="">
            <img id="judgeImage" src="" alt="">
        </div>
        <!--選択肢-->
        <div class="buttonArea">
            <button class="answerBtn"></button>
            <button class="answerBtn"></button>
        </div>
    </div>
    
    <div id="gameClear" class="text-container hidden">
        <div class="message">
            <div id="resultMessage"></div>
            <div class="buttonColumn">
                <button id="replayBtn" class="button">もう一度プレイする</button>
                <button id="shareBtn" class="button">Xで結果を共有</button>   
            </div>
            <div class="linkArea">
                <a href="https://muato1.github.io/UIdaga_fancite1/" target="_blank" class="subButton">🗡非公式ファンサイト</a>
                <a href="disclaimer.html" class="subButton">📖免責事項・素材一覧</a>
            </div>
        </div>
    </div>

    <script>
    'use strict';

    const dagaImages = [
        "photo/daga_1.jpg",
        "photo/daga_2.jpg",
        "photo/daga_3.jpg",
        "photo/daga_4.jpg",
        "photo/daga_5.jpg",
        "photo/daga_6.jpg",
        "photo/daga_7.jpg",
        "photo/daga_8.jpg",
        "photo/daga_9.jpg",
        "photo/daga_10.jpg",
        "photo/daga_11.jpg",
        "photo/daga_12.jpg",
        "photo/daga_13.jpg",
        "photo/daga_14.jpg",
        "photo/daga_15.jpg",
        "photo/daga_16.jpg",
        "photo/daga_17.jpg",
        "photo/daga_18.jpg",
        "photo/daga_19.jpg",
    ];
    const uiImages = [
        "photo/UI_1.jpg",
        "photo/UI_2.jpg",
        "photo/UI_3.jpg",
        "photo/UI_4.jpg",
        "photo/UI_5.jpg",
    ];

    let gameQuestions = [];

    const startBtn = document.getElementById('startBtn');
    const titleScreen = document.getElementById('titleScreen');
    const game = document.getElementById('game');
    const gameClear = document.getElementById('gameClear');
    const replayBtn = document.getElementById('replayBtn');
    const questionImage = document.getElementById('questionImage');
    const judgeImage = document.getElementById('judgeImage');
    const answerButtons = document.querySelectorAll('.answerBtn');
    const countdownScreen = document.getElementById('countdown');
    const countdownMessage = countdownScreen.querySelector('.message');
    const timeNumber = document.getElementById('timeNumber');
    const resultMessage = document.getElementById('resultMessage'); 
    const questionNumber = document.getElementById("questionNumber");
    const shareBtn = document.getElementById("shareBtn");


    let currentQuestion
    let questionCount = 0;  //現在何問目か
    let correctCount = 0; //正解率
    let timeLimit = 3;  //時間制限
    let timerID = null;  //タイマー管理 
    let rank = "";

    //スタートボタン押した後の処理
    const countdown = () => {
        titleScreen.classList.add("hidden");
        countdownScreen.classList.remove("hidden");

        //カウントダウン
        let count = 3;
        countdownMessage.textContent = count;
        const timer = setInterval(() => {
            count--;
            if(count > 0){
                countdownMessage.textContent = count;
            }else{
                clearInterval(timer);
                countdownScreen.classList.add("hidden");
                game.classList.remove("hidden");

                //問題リストを作る
                createQuestionList();
                //最初の問題を表示する
                setQuestion();
            }
        }, 1000);
    }


    //スタートボタンを押したときの処理指定(countdownの関数宣言を上でしている)
    startBtn.addEventListener("click", countdown);
 
    //ゲームで使う問題リスト
    const createQuestionList = () => {
       //しぐれういを１問以上出す
        const uiCount = Math.floor(Math.random()*3)+1;
        //問題リストの初期化
        gameQuestions = [];

        const uiList =[...uiImages];
        const dagaList =[...dagaImages];
        

        //しぐれういの画像を追加
        for(let i = 0; i < uiCount; i++){
            //しぐれうい画像を選ぶ
            const uiIndex = Math.floor(Math.random()*uiList.length);
            const image = uiList.splice(uiIndex,1)[0];

            //しぐれうい出題
            gameQuestions.push({
                image: image,
                correct: 0
            });
        };

        //ういだがーの画像を追加
        for(let i = 0; i < 10 - uiCount; i++){
            //ういだがーの画像を選ぶ
            const dagaIndex = Math.floor(Math.random()*dagaList.length); 
            const image = dagaList.splice(dagaIndex,1)[0];       
            //ういだがー出題
            gameQuestions.push({
                image: image,
                correct: 1
            });
        };
        gameQuestions.sort(() => Math.random() - 0.5);
    }

    //〇×を表示して次の問題へ進む
    const showJudge = (isCorrect) => {
        clearInterval(timerID);

        //ボタンを押せなくする
        answerButtons.forEach(button => {
            button.disabled = true;
        });

        if(isCorrect){
            correctCount++;
            judgeImage.src = "photo/maru.png";
        }else{
            judgeImage.src = "photo/batu.png";
        }
        judgeImage.style.display = "block";

        setTimeout(() => {
            judgeImage.style.display = "none";

            //ボタンを押せるように戻す
            answerButtons.forEach(button => {
                button.disabled = false;
            });

            setQuestion();
        },800);
    };

    //タイマー関数
    const startTimer = () => {
        let time = timeLimit;
        timeNumber.src = `photo/${time}.png`;
        clearInterval(timerID);
        timerID = setInterval(() => {
            time--;
            if(time >= 0){
                timeNumber.src = `photo/${time}.png`;
            }
            if(time == 0){
                showJudge(false);
            }
        },1000);
    }


    // 新しい問題文をランダムにセットする関数
    const setQuestion = () => {
        //
        if(gameQuestions.length === 0){
            //ゲーム終了時にタイマー停止
            clearInterval(timerID);
         
            game.classList.add("hidden");
            gameClear.classList.remove("hidden");

            if(correctCount >=9){
                rank="あなたは『しぐれうい』です。";
            }else if(correctCount >=6){
                rank="あなたは『しぐれういパンデミック』発生時、人類最後の希望になります。";
            }else{
                rank="あなたは『しぐれういch』を24時間視聴する必要があります";
            }
            resultMessage.innerHTML = `<h2>お疲れ様です。10問中${correctCount}問正解！</h2> 
            <p>${rank}</p>`;
            return;
        }   

        currentQuestion = gameQuestions.pop();
        questionCount++;
        questionNumber.textContent = `${questionCount}/10`;
  
        // 画面に新しい問題をセット
        questionImage.src = currentQuestion.image;

        // 選択肢表示
        answerButtons[0].textContent = "しぐれうい";
        answerButtons[1].textContent ="ういだがー";
        
        startTimer();
    };

    answerButtons.forEach((button,index) => {
        button.addEventListener("click",() => {
            showJudge(index === currentQuestion.correct);
        });
    });

    // もう一度プレイするボタン
    replayBtn.addEventListener('click', () => {
        window.location.reload();
    });

    //Xへ共有するボタン
    shareBtn.addEventListener("click", () => {
        const text = `しぐれうい判別 試験  10問中${correctCount}問正解！${rank} #しぐれうい判別試験`;
        const url =`https://x.com/intent/tweet?text=${encodeURIComponent(text)}`;
        window.open(url, "_blank");
    });
    </script>
</body>
</html>
